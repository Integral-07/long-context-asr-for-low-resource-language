model_class: 'Wav2Vec2CTCLongContext'

model:
  base_model: 'karolnowakowski/wav2vec2-large-xlsr-53-pretrain-ain'
  decoder_norm: true
  # 条件A(ainu_wav2vec2_noselfcond_short.yaml)と揃える。理由はそちらの
  # コメント参照(実験⑪: lr=3e-5下でのself_conditioning: false再検証)。
  self_conditioning: false
  attn_implementation: 'sdpa'
  # RoPE不使用(このモデルはRoPEを持たない)。exp/train.pyがsequence_scheduler
  # 伸長のたびに args.config['model']['use_rotary'] を無条件参照するため必須。
  use_rotary: false
  subsampling_factor: 1
  text_hop_length: 320

optimizer:
  name: 'adamw'
  args:
    # 条件A(ainu_wav2vec2_noselfcond_short.yaml)と揃える。
    lr: 3e-5

scheduler:
  warmup_steps: 200

# ainu_wav2vec2_noselfcond_short.yaml(条件A)との対。②③の比較設計を踏襲し、
# 違いは audio_chunking / sequence_scheduler のみ。
audio_chunking:
  size: 256
  overlap: 0

sequence_scheduler:
  increase_every: 200
  stop_after: 999999
  start_after: 0
  max_sequence_length: 8192
  increase_by_multiplier: 2
  batch_size_multiplier: 0.5
  interpolate_rotary: false

wandb:
  use: false
  project_name: "ainu_wav2vec2_noselfcond_long"
  name: "ainu-wav2vec2-noselfcond-long-context"
  id: ""
  update_config_with_wandb_id: false

checkpointing:
  dir: /home/t23cs033/long-context-asr/checkpoints/ainu_wav2vec2_noselfcond_long
  save_every_n_steps: 150

data:
  path: /home/t23cs033/long-context-asr/data/ainu_wav2vec2_longcontext_collections/train_mapping.json

training:
  tokenizer_path: /home/t23cs033/long-context-asr/lcasr/artifacts/ainu/tokenizer.model
  start_spec_augment_after_n_epochs: -1  # 未検証のため今回は無効化
  max_epochs: 30
  batch_size: 4
  backprop_every: 1
  backwards_every: 1
  max_seq_len: 0
  clip_value: 0.8
  # self_conditioning: false なので無効(念のため明示、aeffd99と同じ扱い)
  intermediate_loss_weighting: 0.0
  random_seed: 552268
  dtype: bfloat16
