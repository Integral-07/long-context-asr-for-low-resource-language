model_class: 'Wav2Vec2CTCLongContext'

model:
  base_model: 'karolnowakowski/wav2vec2-large-xlsr-53-pretrain-ain'
  decoder_norm: true
  # 実験⑫: 実験⑪(self_conditioning: false)をベースに、さらに渡辺さんの
  # finetune_xlsr53_ainu notebookの設定(HFトークナイザ・CTC loss mean・
  # greedyデコード)を組み込んで再検証する。self_conditioningの扱いは
  # 実験⑪と同じ(理由はainu_wav2vec2_noselfcond_short.yaml参照)。
  self_conditioning: false
  attn_implementation: 'sdpa'
  subsampling_factor: 1
  text_hop_length: 320

optimizer:
  name: 'adamw'
  args:
    # 実験⑪までのlr=3e-5はCTC loss reduction='sum'前提で調整した値。
    # 'mean'に変えると損失スケールが大きく変わる(バッチ内の総ターゲット長で
    # 割るため、'sum'より何桁も小さくなる)ため、3e-5のままでは実質学習が
    # 進まなくなる。渡辺さんのnotebook自体のlr(1e-4)に合わせる。
    # 要注意: この変更は未検証で、fold0での収束を見てから要調整。
    lr: 1e-4

scheduler:
  warmup_steps: 200

audio_chunking:
  size: 1536
  overlap: 0

decoding:
  # 渡辺さんのnotebookと同じargmax greedyデコード(lcasr/decoding/greedy.py)。
  method: greedy

wandb:
  use: false
  project_name: "ainu_wav2vec2_hftok_short"
  name: "ainu-wav2vec2-hftok-short-context"
  id: ""
  update_config_with_wandb_id: false

checkpointing:
  dir: /home/t23cs033/long-context-asr/checkpoints/ainu_wav2vec2_hftok_short
  save_every_n_steps: 2000

data:
  path: /home/t23cs033/long-context-asr/data/ainu_wav2vec2_longcontext_utterances/train_mapping.json

training:
  # .model で終わらないパス = HF Wav2Vec2CTCTokenizer形式
  # (lcasr/utils/audio_tools.py:load_tokenizer が自動判別、scripts/train_ainu_hf_tokenizer.pyで生成)
  tokenizer_path: /home/t23cs033/long-context-asr/lcasr/artifacts/ainu_hftok_kfold/fold0
  # 渡辺さんのnotebookと同じ(Wav2Vec2ForCTCのデフォルトCTC loss設定)
  ctc_loss_reduction: mean
  start_spec_augment_after_n_epochs: -1  # 未検証のため今回は無効化
  max_epochs: 30
  batch_size: 8
  backprop_every: 1
  backwards_every: 1
  max_seq_len: 0
  clip_value: 0.8
  intermediate_loss_weighting: 0.0
  random_seed: 552268
  dtype: bfloat16
